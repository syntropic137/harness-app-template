# harness/.harness/governance.toml — Eat-our-own-dogfood fitness gate.
#
# This file is the architectural fitness contract for the HARNESS ITSELF.
# Run with: ./target/release/harness-sensors gate harness/
#
# ── HARNESS-ENGINEERING PROTECTED ───────────────────────────────────────
# DO NOT RELAX THESE THRESHOLDS. They are deliberately strict because the
# harness's job is to GATE other projects — if we can't pass our own gate,
# we have no credibility. If a threshold here starts blocking real work,
# the correct move is to:
#   1. File a hypothesis-first experiment under `experiments/` arguing why
#      the threshold needs adjustment, citing the specific module + score.
#   2. Land the experiment's run-commit with a verdict (go / no-go / inc).
#   3. Update this file as part of that run-commit.
# Do not silently raise a `max_*` or lower a `min_*` value.
# ─────────────────────────────────────────────────────────────────────────

[constraints]
# Sentrux composite. Warn-only per the project-level rationale (EXP-A).
min_quality_signal = { value = 0.5, severity = "warn" }

# Zero import cycles. Hard fail. The harness must be acyclic.
max_cycles = 0

# Zero god files. Hard fail. Harness modules must stay focused.
max_god_file_count = 0

# Martin distance-from-main-sequence cap. Warn-only because some harness
# modules are wiring (high I) and others are abstract contracts (high A);
# both legitimately drift from the main sequence.
max_distance_from_main_sequence = { value = 0.7, severity = "warn" }

# Subscores (require the sentrux patches applied via `just bootstrap-sentrux`).
min_acyclicity_score = { value = 0.95, severity = "warn" }
min_modularity_score = { value = 0.4, severity = "warn" }
max_max_depth = { value = 8, severity = "warn" }

# ── ADR-0028 PROFILES ───────────────────────────────────────────────────
# Profiles control which adapters are REQUIRED by the gate.  An adapter
# that is absent but not required degrades to "no-reading" (skipped) rather
# than failing the gate.  Unknown profile names are a hard error (exit 2).
#
# strict  — requires every adapter in KNOWN_ADAPTERS EXCEPT the perf-gate-owned
#           ones (PERF_GATE_OWNED_ADAPTERS in gate.mjs: hyperfine-perf), so an
#           unconfigured / CI environment fails closed unless every non-perf
#           adapter produced a reading. hyperfine-perf is excluded because its
#           enforcement is owned by the dedicated harness/perf/gate.mjs (which
#           owns the tolerance window); the PF01 startup-benchmark-mean reads
#           null on a scaffold with no committed benchmarks, which is "nothing
#           to measure yet", not an adapter failure. Any adapter added to
#           KNOWN_ADAPTERS in gate.mjs must also be added to the
#           [profiles.strict] table below (unless perf-gate-owned); the
#           governance-profiles test (sensors-governance-profiles.test.ts)
#           enforces parity against strictRequiredAdapters().
# local   — the zero-dependency adapters, PLUS apss-topology:
#             deadcode         (scoped grep, no external binary)
#             cruiser-coupling (dependency-cruiser + aggregate, pure-node)
#             complexity       (complexity.mjs, pure-node)
#             apss-topology    (needs the APSS binary + .topology/ data)
#
#           apss-topology is required here deliberately, and it is the one
#           entry that costs an install. It is the ONLY source of the MT01
#           max-cognitive / max-cyclomatic readings, so while it was optional
#           a developer machine without it pushed green on complexity
#           regressions that CI then rejected against --profile=strict. A gate
#           that silently does not run is not a gate; the loop has to enforce
#           what the merge enforces.
#
#           The cost is small: `apss run code-topology analyze .` is ~2.5s
#           against ~45s for the whole gate (measured on 843 functions, warm
#           and cold alike), so this buys real enforcement for ~5% wall-clock.
#
#           A fresh clone therefore needs `just apss-install` before its first
#           push. `just doctor` reports apss as a required adapter so the gap
#           is visible before it blocks a push rather than during one.
#
#           Still NOT required here, and skipped-loud when absent: sentrux,
#           ubs-security, hyperfine-perf, suite-duration, coverage, license.
[profiles.strict]
required_adapters = ["sentrux", "apss-topology", "complexity", "cruiser-coupling", "ubs-security", "license", "deadcode", "suite-duration", "coverage", "loc"]

[profiles.local]
required_adapters = ["deadcode", "cruiser-coupling", "complexity", "apss-topology"]
