packages:
  - ws_apps/*
  - ws_packages/*
  - harness/*

overrides:
  esbuild: 0.28.2 # GHSA advisory: arbitrary file read via the dev server on
    # Windows, vulnerable >=0.27.3 <0.28.1. The previous pin here was 0.27.7,
    # which is INSIDE that range -- the override existed but had gone stale
    # against a later advisory. 0.28.2 (38d old at pin time) clears it and is
    # far enough from publication for the minimumReleaseAge policy below.
  # Security patches (dep-audit, GHSA advisories below). Pinned to specific
  # already-established versions, not open ranges: pnpm's supply-chain policy
  # rejects any resolved version published within the last 24h, and an
  # unbounded ">=" range can float onto a just-published release that trips
  # that guard in CI even though it satisfies the advisory's own floor.
  # GHSA-3jxr-9vmj-r5cp: two different minimatch majors coexist in this
  # workspace (minimatch@9 wants brace-expansion ^2.0.2, minimatch@10 wants
  # ^5.0.5), and brace-expansion's export shape changed across those majors
  # (CJS default vs a named `.expand` export), so ONE blanket override breaks
  # whichever major it doesn't match. Scoped per parent instead of a single
  # bare key.
  minimatch@9>brace-expansion: 2.1.4
  minimatch@10>brace-expansion: ">=5.0.7"
  postcss>nanoid: 3.3.18 # GHSA-2v37-7h3g-55p8; the only consumer in this tree
    # is postcss (ws_apps/docs -> next -> postcss), so the override is scoped
    # to that parent rather than applied blanket -- same reasoning as the
    # brace-expansion entries above, where a cross-major blanket pin would
    # silently hand a future consumer an incompatible line.
  postcss: 8.5.26 # GHSA-fxqj-rqcc-2cmp; reaches us via ws_apps/docs -> next.
    # Exact pin per the policy above.
  fumadocs-mdx>js-yaml: 5.2.2 # GHSA-pm4m-ph32-ghv5; fumadocs-mdx is the only
    # consumer in this tree. Scoped to it so that a future dependency needing
    # js-yaml@4 -- a materially different API surface -- is not silently given
    # 5.x. Replaces a dead `js-yaml@>=4.0.0 <4.3.0` selector
    # (GHSA-52cp-r559-cp3m) that matched nothing once the tree moved to 5.x.
  "@opentelemetry/propagator-jaeger": 2.9.0 # GHSA-45rx-2jwx-cxfr; some
    # consumers pin this to an exact version (no range) rather than a caret
    # range, so a range-selector override key doesn't match -- the bare
    # package-name key does. Pinned exact (not >=2.9.0) so a future
    # `pnpm install` can't float onto a same-day 2.x release and trip the
    # minimumReleaseAge policy again.
  "@opentelemetry/core": 2.9.0 # peer of propagator-jaeger above; without
    # pinning it too, it naturally resolves to the newest release and trips
    # the same minimumReleaseAge policy on its own.
  sharp: 0.35.4 # GHSA-f88m-g3jw-g9cj; same reasoning as propagator-jaeger
    # above (bare key, exact pin) -- pinned rather than an open ">=" range
    # to avoid floating onto a too-recent release.
    # BUMPED 0.35.3 -> 0.35.4: libheif advisories GHSA-g89c-p67h-r497 and
    # GHSA-2jg2-4ch7-h545 land on <0.35.4, so the pin that fixed the older
    # advisory became the vulnerable version itself. A pin is a snapshot of
    # one advisory's floor, not a standing guarantee -- it needs re-checking
    # whenever dep-audit reports the same package again.
  baseline-browser-mapping: 2.11.23 # process termination on invalid input
    # (DoS), vulnerable >=2.0.0 <2.11.0. Reaches us via ws_apps/docs -> next.
    # 2.11.23 is 4 days old; 2.11.24 exists but was published ~1 day before
    # pinning, which is exactly what minimumReleaseAge rejects.

allowBuilds:
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  turbo: true
