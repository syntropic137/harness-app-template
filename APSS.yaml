schema: apss.project/v1

project:
  name: 20260608_apss-integration
  apss_version: v1

tool:
  hooks:
    # Keep pre-commit validation enabled unless it is temporarily blocking critical refactoring.
    #
    # EXECUTOR: lefthook, not `apss install`. lefthook owns .git/hooks in this
    # repo, so a hook installed there by another tool is either clobbered on the
    # next `lefthook install` or wins by repointing core.hooksPath and silently
    # shadowing every other gate. The APS-V1-0003 validator therefore runs as
    # the `apss-docs` job in lefthook.yml. Do not run `apss install`'s hook
    # step; flipping this to false would only make the declaration inert again,
    # not disable the gate.
    pre_commit: true

standards:
  # STAGED FOR PHASE B (issue #58): bumped to >=0.3.0 for the SonarSource
  # cognitive-complexity fix (AgentParadise PR #90). Requires aps-cli 1.4.0.
  # Run `just apss-install` once code-topology 0.3.0 is published to regenerate
  # apss.lock with the real checksum, then re-derive the MT01 baseline.
  code-topology:
    id: APS-V1-0001
    version: ">=0.3.0"
  architecture-fitness:
    id: APS-V1-0002
    version: ">=0.2.0"
  documentation:
    id: APS-V1-0003
    version: ">=0.1.0"
